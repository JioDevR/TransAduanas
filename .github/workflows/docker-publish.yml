name: Publicar imágenes Docker en GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sga-backend
            context: ./backend-sga
            file: ./backend-sga/Dockerfile
            build-args: ""
          - image: app-sga
            context: .
            file: ./app-sga/Dockerfile
            build-args: |
              VITE_API_URL=/api/v1
              VITE_PORTAL_URL=${{ vars.PORTAL_PUBLIC_URL || 'http://localhost:5174' }}
          - image: app-b2b
            context: .
            file: ./app-b2b/Dockerfile
            build-args: |
              VITE_API_URL=/api/v1
          - image: app-landing
            context: ./app-landing
            file: ./app-landing/Dockerfile
            build-args: |
              VITE_SGA_APP_URL=${{ vars.SGA_PUBLIC_URL || 'http://localhost:5180' }}
              VITE_PORTAL_CLIENTE_URL=${{ vars.PORTAL_PUBLIC_URL || 'http://localhost:5174' }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular nombre de imagen en minúsculas
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extraer metadatos (tags y labels OCI)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
