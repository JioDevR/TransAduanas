<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{reports/ti-listado-base :: tiHead(${tituloDocumento})}"></head>
<body>

    <table th:replace="~{reports/ti-listado-base :: tiHeader(${kickerTexto}, ${tituloReporte}, ${alcanceTexto}, ${fechaGeneracion}, ${totalListado}, 'cuentas')}"></table>

    <table th:replace="~{reports/ti-listado-base :: tiSummary(${tituloMetrica1}, ${totalListado}, 'Empresas Clientes', ${totalEmpresas}, 'Total Registradas', ${totalRegistrados})}"></table>

    <table class="ti-list-table">
        <thead>
            <tr>
                <th style="width: 14%;">USUARIO</th>
                <th style="width: 30%;">EMPRESA / RUC</th>
                <th style="width: 20%;">REPRESENTANTE</th>
                <th style="width: 26%;">CORREO</th>
                <th style="width: 10%;">ESTADO</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="5" class="ti-empty-row">No se encontraron usuarios del portal para mostrar en este informe.</td>
            </tr>
            <tr th:each="p : ${items}">
                <td><span class="ti-user-chip" th:text="'@' + ${p.username}">@20370146994</span></td>
                <td>
                    <strong th:text="${p.empresa}">Empresa Cliente S.A.C.</strong><br />
                    <span class="ti-sub-text" th:text="'RUC: ' + ${p.ruc}">RUC: 20370146994</span>
                </td>
                <td th:text="${p.representante}">Representante Legal</td>
                <td><span class="ti-email-text" th:text="${p.correo}">contacto@empresa.pe</span></td>
                <td>
                    <span th:class="${p.estado == 'Activo'} ? 'ti-badge-ok' : 'ti-badge-err'" th:text="${p.estado}">Activo</span>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
