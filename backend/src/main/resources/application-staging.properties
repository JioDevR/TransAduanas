# Entorno de despliegue de laboratorio
server.port=${SERVER_PORT:8086}

# Conexion a la base original mediante variables del entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Comprobar el esquema sin modificarlo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Configuracion necesaria para iniciar el backend
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.storage.upload-dir=${STORAGE_DIR}

# No insertar datos iniciales ni de demostracion en staging
app.data-initializer.enabled=false