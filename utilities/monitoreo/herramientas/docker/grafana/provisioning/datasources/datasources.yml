apiVersion: 1
datasources:
  - name: Prometheus TransAduanas
    uid: transaduanas-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST
  - name: Loki TransAduanas
    uid: transaduanas-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
