# Variante Docker de ../loki/loki.yml: rutas dentro del volumen /loki y escucha
# en todas las interfaces de la red interna (el puerto no se publica al host).
server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9096
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  filesystem:
    directory: /loki/chunks
ingester:
  wal:
    dir: /loki/wal
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 8
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 8
limits_config:
  retention_period: 48h
  ingestion_rate_mb: 4
  max_query_parallelism: 2
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_worker_count: 1
analytics:
  reporting_enabled: false
