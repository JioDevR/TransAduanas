[paths]
data = ${MONITORING_GRAFANA_DATA}
logs = ${MONITORING_GRAFANA_LOGS}
provisioning = ${MONITORING_GRAFANA_PROVISIONING}

[server]
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/

[security]
admin_user = admin
admin_password = ${MONITORING_GRAFANA_ADMIN_PASSWORD}
secret_key = ${MONITORING_GRAFANA_SECRET_KEY}
disable_gravatar = true

[users]
allow_sign_up = false
default_theme = light

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[news]
news_feed_enabled = false

[dashboards]
default_home_dashboard_path = ${MONITORING_HOME_DASHBOARD}
