global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - reglas.yml
scrape_configs:
  - job_name: transaduanas-backend
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: ['127.0.0.1:9086']
        labels:
          entorno: laboratorio

  - job_name: transaduanas-http
    metrics_path: /probe
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['http://127.0.0.1:5173/']
        labels: {servicio: app-landing, entorno: aplicacion, modulo: pagina}
      - targets: ['http://127.0.0.1:5174/']
        labels: {servicio: app-b2b, entorno: aplicacion, modulo: pagina}
      - targets: ['http://127.0.0.1:5180/']
        labels: {servicio: app-sga, entorno: aplicacion, modulo: pagina}
      - targets: ['http://127.0.0.1:5180/api/v1/catalogos/puertos']
        labels: {servicio: api-catalogo-puertos, entorno: aplicacion, modulo: api}
    file_sd_configs:
      - files: ['objetivos-pruebas.json']
        refresh_interval: 2s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [modulo]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: transaduanas-loki
    scrape_interval: 5s
    static_configs:
      - targets: ['127.0.0.1:3100']
  - job_name: transaduanas-alloy
    scrape_interval: 5s
    static_configs:
      - targets: ['127.0.0.1:12345']
